name: ETF Wealth Builder — daily monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. 20:30 UTC is a starter schedule after most US sessions;
    # adjust for daylight-saving changes and your preferred market close.
    - cron: "30 20 * * 1-5"

# Least privilege: the GITHUB_TOKEN can only read the repository.
# No job pushes commits, comments on PRs or writes releases, so no write scope is granted.
permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Restore alert state cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data/state
          key: etf-alert-state-${{ github.run_id }}
          restore-keys: etf-alert-state-
      - name: Run monitor
        env:
          VALUEINVESTING_API_KEY: ${{ secrets.VALUEINVESTING_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m src.main --once
      - name: Archive daily JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etf-wealth-builder-report-${{ github.run_id }}
          path: data/reports/*.json
          if-no-files-found: warn
          retention-days: 90
