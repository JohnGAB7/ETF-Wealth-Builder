name: Python tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the GITHUB_TOKEN can only read the repository.
# No job pushes commits, comments on PRs or writes releases, so no write scope is granted.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Generate e-mail previews (fictitious data, nothing is sent)
        run: python -m src.notifications.preview --out data/previews
      - name: Upload e-mail previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: email-previews-${{ github.run_id }}
          path: data/previews/
          retention-days: 14
