name: Python tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m pytest -q
      - name: Generate e-mail previews (fictitious data, nothing is sent)
        run: python -m src.notifications.preview --out data/previews
      - name: Upload e-mail previews
        uses: actions/upload-artifact@v4
        with:
          name: email-previews-${{ github.run_id }}
          path: data/previews/
          retention-days: 14
