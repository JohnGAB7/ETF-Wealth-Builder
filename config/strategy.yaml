forecast_horizons_days: [21, 63, 126]
primary_horizon_days: 63
minimum_training_rows: 500
minimum_validation_rows: 100
probability_buy_threshold: 0.62
opportunity_score_threshold: 75
minimum_data_coverage: 0.70
# Fail closed: no review signal when the last price is older than this (calendar days).
max_price_age_days: 5
max_alerts_per_etf_per_day: 1
email_on_signal_upgrade_only: true
walk_forward_test_fraction: 0.25
random_state: 42

# Transparent signal blend; normalize weights in code.
score_weights:
  probability_positive: 0.25
  expected_return: 0.15
  downside_risk: 0.15
  valuation_gap: 0.20
  technical_setup: 0.10
  macro_news: 0.10
  data_quality: 0.05

# Lot 5.1 — purged walk-forward validation, OBSERVATION MODE ONLY.
# Results are reported (JSON + e-mail) but no signal reads them.
validation:
  test_block_days: 126      # length of each out-of-sample block (sessions)
  refresh_days: 7           # recompute at most once a week (cached in data/state)
  bootstrap_draws: 1000

# Proposed gate (docs/audit/LOT5_REPONSE_REVUE_CHATGPT.md, 3.6). PENDING A HUMAN
# DECISION: used only to compute `proposed_status`, never to change a signal.
validation_gate_proposed:
  min_effective_windows: 20
  bss_ci_lower_above: 0.0
  min_positive_block_share: 0.60
  max_brier_excess_vs_logistic: 0.005
  calibration_slope_min: 0.5
  calibration_slope_max: 1.5
